name: Build Windows app
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Build
        run: dotnet build src/Handshake.Desktop/Handshake.Desktop.csproj --configuration Release
      - name: Test
        run: dotnet test tests/Handshake.Desktop.Tests/Handshake.Desktop.Tests.csproj --configuration Release --no-restore
      - name: Publish
        run: dotnet publish src/Handshake.Desktop/Handshake.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: Handshake-win-x64
          path: artifacts/win-x64
